name: Deploy ConnectPixel Studio staging

on:
  push:
    branches: [feat/connectpixel-studio-v2]

permissions:
  contents: read

concurrency:
  group: connectpixel-studio-staging
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Deploy isolated CMS staging Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source, staged session security, R2 and interface
        run: |
          npm test
          node scripts/studio-security.test.mjs
          node scripts/studio-ui.test.mjs
          node scripts/portfolio-migration.test.mjs
      - name: Verify isolated CMS staging and R2 bindings
        run: |
          grep -q 'STUDIO_ENV = "staging"' wrangler.toml
          grep -q 'STUDIO_READ_ONLY = "false"' wrangler.toml
          grep -q 'binding = "R2_PRIVATE"' wrangler.toml
          grep -q 'bucket_name = "connectpixel-cms-private"' wrangler.toml
          grep -q 'binding = "R2_PUBLISHED"' wrangler.toml
          grep -q 'bucket_name = "connectpixel-studio-preview"' wrangler.toml
          grep -q 'binding = "R2_BUCKET"' wrangler.toml
          grep -q 'name = "LOGIN_RATE_LIMIT"' wrangler.toml
      - name: Deploy to new Worker only, never to existing siteadmin or domain
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --name connectpixel-studio-staging
      - name: Smoke-test staging HTTP routing and draft privacy
        run: |
          set -euo pipefail
          base="https://connectpixel-studio-staging.mktdigital663.workers.dev"
          status=$(curl --retry 3 --retry-delay 2 -sS -o /tmp/live.json -w '%{http_code}' "$base/api/content/site-content")
          test "$status" = "200"
          grep -q '"site"' /tmp/live.json
          status=$(curl -sS -o /tmp/draft.json -w '%{http_code}' "$base/api/content/draft-site-content")
          test "$status" = "404"
          status=$(curl -sS -o /tmp/admin.json -w '%{http_code}' "$base/api/admin/diagnostics")
          test "$status" = "401"
          status=$(curl -sS -o /tmp/session.json -w '%{http_code}' "$base/api/session")
          test "$status" = "401"
          status=$(curl -sS -o /tmp/studio-login.html -w '%{http_code}' "$base/admin/")
          test "$status" = "200"
          grep -q 'id="loginUsername"' /tmp/studio-login.html
          grep -q 'id="loginToken"' /tmp/studio-login.html
          test "$(grep -o 'class="login-mobile-brand"' /tmp/studio-login.html | wc -l | tr -d ' ')" = "1"
          echo 'PASS: username and password fields, exactly one mobile brand'
          echo 'PASS: public content JSON, private draft hidden, admin and session protected'
      - name: Install Chromium for responsive QA
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run mobile login QA in Chromium
        run: node scripts/studio-mobile-qa.mjs
      - name: Save responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connectpixel-studio-responsive-login
          path: artifacts/studio-mobile-qa/
          if-no-files-found: ignore
          retention-days: 7
