name = "connectpixel-siteadmin"
main = "src/index.js"
compatibility_date = "2026-05-04"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"

[vars]
PUBLIC_R2_BASE_URL = "https://media.connectpixel.online"
# Homologação segura: bloqueia todas as mutações do painel até revisão final.
STUDIO_READ_ONLY = "true"
# Usuário administrativo inicial, alterável nas variáveis do Worker.
ADMIN_USERNAME = "admin"
CRM_CMS_BRIDGE_ENABLED = "true"
CRM_SUPABASE_URL = "https://zabntyzdhfaapnjdlzop.supabase.co"
CRM_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_8G2mpbEaciBsvE33CNwz_A_BPcRCKeL"
CRM_ORGANIZATION_ID = "84d76747-6dc0-4a40-8306-33ece06e8cb7"

# Configure no Cloudflare:
# ADMIN_TOKEN como Secret (senha, nunca exponha em arquivo ou frontend)
# ADMIN_USERNAME como variável (nome de usuário)
# R2_BUCKET como binding R2

# Binding R2 do painel administrativo.
# IMPORTANTE: troque o bucket_name abaixo pelo nome EXATO do bucket em:
# Cloudflare > R2 Object Storage > Buckets
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "connectpixel-media"

# Exclusivamente para rascunhos, backups, logs e versões.
# Bucket R2 PRIVADO, sem r2.dev e sem domínio público.
[[r2_buckets]]
binding = "R2_PRIVATE"
bucket_name = "connectpixel-cms-private"

# Conteúdo publicado da homologação. Bucket privado, sem domínio público.
# Mantém os JSONs de teste separados do connectpixel-media.
[[r2_buckets]]
binding = "R2_PUBLISHED"
bucket_name = "connectpixel-studio-preview"

# Limita tentativas de login por localização do Cloudflare (aproximado).
# Recurso nativo do Workers; sem armazenar senhas nem endereços IP em R2.
[[ratelimits]]
name = "LOGIN_RATE_LIMIT"
namespace_id = "27102644"

  [ratelimits.simple]
  limit = 8
  period = 60
