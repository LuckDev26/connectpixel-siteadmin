<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sem conexão — ConnectPixel</title>
  <meta name="theme-color" content="#0a0d12" />
  <style>
    :root {
      --bg: #0a0d12;
      --bg2: #10161e;
      --text: #eef3f7;
      --muted: #8da0b2;
      --accent: #48e5c2;
      --accent2: #a6ec61;
      --border: rgba(255,255,255,.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 20%, rgba(72,229,194,.14), transparent 32%),
        radial-gradient(circle at 50% 82%, rgba(166,236,97,.08), transparent 30%),
        linear-gradient(180deg, var(--bg), #0f141c);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: min(100%, 480px);
      background: rgba(16,22,30,.84);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.28);
      backdrop-filter: blur(18px);
    }
    img { width: 96px; height: 96px; object-fit: contain; margin-bottom: 20px; }
    h1 { margin: 0 0 12px; font-size: clamp(1.7rem, 5vw, 2.2rem); }
    p { margin: 0 0 22px; color: var(--muted); line-height: 1.65; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a, button {
      appearance: none; border: 0; cursor: pointer; text-decoration: none;
      border-radius: 999px; padding: 14px 18px; font-weight: 700; font-size: .95rem;
    }
    .primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #071016;
      box-shadow: 0 10px 28px rgba(72,229,194,.22);
    }
    .ghost {
      background: transparent; color: var(--text); border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/assets/iconnew-192.png" alt="ConnectPixel" />
    <h1>Você está sem internet</h1>
    <p>Seu app continua com a identidade da ConnectPixel, mas esta página precisa de conexão para carregar o conteúdo mais recente.</p>
    <div class="actions">
      <button class="primary" onclick="location.reload()">Tentar novamente</button>
      <a class="ghost" href="/">Voltar ao início</a>
    </div>
  </div>
</body>
</html>
